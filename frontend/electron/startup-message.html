<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Monaw could not start</title>
    <link rel="stylesheet" href="message-dialog.css">
    <script src="startup-message.js" defer></script>
  </head>
  <body class="monaw-startup">
    <main class="monaw-message monaw-startup-message">
      <h1 id="message-title" class="monaw-message-title">Monaw could not start</h1>
      <p id="message-body" class="monaw-message-body"></p>
      <p id="message-detail" class="monaw-message-body"></p>
      <div class="monaw-message-actions">
        <button id="quit" type="button" class="monaw-message-button monaw-message-primary" autofocus>Quit</button>
      </div>
    </main>
  </body>
</html>
