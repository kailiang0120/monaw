name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.group }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - api
          - runtime
          - policy
          - sandbox
          - skills
          - memory
          - integrations
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run backend group
        shell: pwsh
        run: |
          uv run --directory backend --locked python -c "import sys; print(sys.version); print(sys.executable); assert sys.version_info[:2] == (3, 11)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-backend.ps1 -Group ${{ matrix.group }} -TimeoutSeconds 1200 -JUnitPath "test-results/${{ matrix.group }}.xml"

      - name: Check generated API contracts
        if: matrix.group == 'api'
        working-directory: backend
        run: uv run --locked python ../scripts/generate-api-docs.py --check

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.group }}-python-3.11
          path: backend/test-results/*.xml
          if-no-files-found: warn

  runtime-compatibility:
    name: Execution, scheduling, and boundary compatibility (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify execution lifecycle on the compatibility interpreter
        working-directory: backend
        shell: pwsh
        run: |
          uv sync --locked --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --python 3.12 python -c "import sys; print(sys.version); print(sys.executable); assert sys.version_info[:2] == (3, 12)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --python 3.12 pytest -m "runtime or integrations or sandbox or skills" --junitxml=test-results/compatibility.xml

      - name: Upload compatibility test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-compatibility-python-3.12
          path: backend/test-results/*.xml
          if-no-files-found: warn

  # The Windows jobs above mock Docker, so nothing there proves the pinned image
  # exists or that a container actually runs. Linux runners have a working Docker
  # daemon; this job pulls the digest and exercises the real container paths.
  # Tests are selected by path because collecting the whole suite would import
  # the Windows-only computer_use modules.
  docker-sandbox:
    name: Docker sandbox (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked

      # Fails if the pinned digest does not resolve, which no other job checks.
      - name: Pull the pinned sandbox image
        working-directory: backend
        run: |
          image=$(uv run python -c "from app.agent.settings_store import AgentSettings; print(AgentSettings().sandbox.docker.image)")
          echo "Pinned image: $image"
          case "$image" in
            *@sha256:*) ;;
            *) echo "Sandbox image is not pinned to a digest"; exit 1 ;;
          esac
          docker pull "$image"

      - name: Run Docker sandbox tests against a real daemon
        working-directory: backend
        env:
          MONAW_REQUIRE_DOCKER_TESTS: "1"
        run: |
          uv run pytest -v \
            --junitxml=test-results/docker.xml \
            app/agent/tests/test_sandbox_docker.py \
            app/agent/tests/test_sandbox_image_inventory.py

      # Policy decides what may run in the container from a module inventory. If
      # that inventory is wrong, commands are routed into an image that cannot
      # run them, which is invisible to every mocked test.
      - name: Verify the image inventory matches policy's expectations
        working-directory: backend
        run: |
          uv run python -c "
          from app.agent.settings_store import AgentSettings
          from app.agent.sandbox.image_inventory import probe_python_module_inventory
          from app.agent.sandbox.policy import _PYTHON_312_STDLIB_MODULES as table

          image = AgentSettings().sandbox.docker.image
          actual = probe_python_module_inventory(image)
          print(f'probed {len(actual)} importable modules in {image}')

          claimed_but_absent = sorted(table - actual)
          if claimed_but_absent:
              raise SystemExit(
                  'Offline table claims modules the image cannot import: '
                  + ', '.join(claimed_but_absent)
              )
          print(f'offline table is a safe subset ({len(actual - table)} extra modules available)')
          "

      - name: Upload real Docker test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-sandbox-python-3.12
          path: backend/test-results/*.xml
          if-no-files-found: warn

  application:
    name: Electron and backend workflows (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Prepare locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and Electron dependencies
        working-directory: frontend
        run: npm ci
      - name: Run disposable application workflows
        working-directory: frontend
        run: npm run test:app
      - name: Upload application report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-windows-python-3.11-node-22.13
          path: |
            frontend/test-results/application.xml
            frontend/test-results/application/
          if-no-files-found: warn

  commits:
    name: Per-commit integrity
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      # Full history: the range being checked is older than the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Each commit must stand on its own: compile, import, boot the API,
      # type-check, and produce a renderer bundle. The other jobs only prove
      # that about the tip, so a commit referencing something added later still
      # passes them while breaking bisect, revert, and anyone who checks it out.
      - name: Check every commit in the range
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./scripts/check-commits.ps1 -MaxCommits 20

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.13.0", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test, type-check, and build
        working-directory: frontend
        run: npm run verify:ci

      - name: Upload renderer test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-node-${{ matrix.node }}
          path: frontend/test-results/*.xml
          if-no-files-found: warn
