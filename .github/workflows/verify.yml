name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.group }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - api
          - runtime
          - policy
          - sandbox
          - skills
          - memory
          - integrations
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run backend group
        shell: pwsh
        run: ./scripts/test-backend.ps1 -Group ${{ matrix.group }} -TimeoutSeconds 1200

  commits:
    name: Per-commit integrity
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      # Full history: the range being checked is older than the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Each commit must compile, import, and type-check on its own. The other
      # jobs only prove that about the tip, so a commit referencing something
      # added later still passes them while breaking bisect and revert.
      - name: Check every commit in the range
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./scripts/check-commits.ps1 -MaxCommits 30

  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test, type-check, and build
        working-directory: frontend
        run: npm run verify
