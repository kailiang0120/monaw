name: Upgrade check

# Installs a published release on a clean runner, seeds data, installs this
# commit's build over it and checks the data and the app survive. Run by hand
# before publishing a release. See docs/packaging.md.

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: Release to upgrade from
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade from ${{ inputs.from_tag }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the installer
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Download the ${{ inputs.from_tag }} installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_TAG: ${{ inputs.from_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "$env:FROM_TAG" --repo "$env:REPOSITORY" --pattern "Monaw-Setup-*-x64.exe" --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $release = gh release view "$env:FROM_TAG" --repo "$env:REPOSITORY" --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata lookup failed' }
          $installer = @(Get-Item previous/Monaw-Setup-*-x64.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one previous installer' }
          $asset = @($release.assets | Where-Object { $_.name -eq $installer[0].Name })
          if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw 'Release asset has no unique SHA-256 digest' }
          if ((Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash -ne $asset[0].digest.Substring(7)) { throw 'Previous installer hash mismatch' }
          $candidate = @(Get-Item frontend/release/Monaw-Setup-*-x64.exe)
          if ($candidate.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          $hash = (Get-FileHash $candidate[0].FullName -Algorithm SHA256).Hash
          "Candidate SHA-256: $hash`nCommit: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID" | Tee-Object -FilePath candidate-checksum.txt
          "CANDIDATE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upgrade
        shell: pwsh
        run: |
          ./scripts/check-upgrade.ps1 `
            -FromInstaller (Get-Item previous/Monaw-Setup-*-x64.exe).FullName `
            -ToInstaller (Get-Item frontend/release/Monaw-Setup-*-x64.exe).FullName `
            -WorkDir "$env:RUNNER_TEMP/monaw-upgrade" `
            -ExpectedVersion ((Get-Content frontend/package.json -Raw | ConvertFrom-Json).version) `
            -ExpectedCandidateSha256 $env:CANDIDATE_SHA256

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-check-logs
          path: |
            ${{ runner.temp }}/monaw-upgrade/*.log*
            ${{ runner.temp }}/monaw-upgrade/home/runtime/*.log
            candidate-checksum.txt
          if-no-files-found: warn

  update:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the initial installer
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Initial build failed' }
          Copy-Item frontend/release/Monaw-Setup-1.1.0-x64.exe "$env:RUNNER_TEMP/monaw-initial.exe"
      - name: Build a newer test installer
        shell: pwsh
        run: |
          Push-Location frontend
          try { npm version 1.1.1 --no-git-tag-version --ignore-scripts; if ($LASTEXITCODE -ne 0) { throw 'Version change failed' } }
          finally { Pop-Location }
          ./scripts/package-windows.ps1 -SkipBackend
          if ($LASTEXITCODE -ne 0) { throw 'Update build failed' }
      - name: Install the initial version into a disposable folder
        shell: pwsh
        run: |
          $existing = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Monaw*' }
          if ($existing) { throw 'This test requires a clean runner without Monaw installed.' }
          $installDir = Join-Path $env:TEMP "monaw-update-test-$([guid]::NewGuid().ToString('N'))"
          $process = Start-Process "$env:RUNNER_TEMP/monaw-initial.exe" -ArgumentList '/S', "/D=$installDir" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $installDir 'Monaw.exe'))) { throw 'Initial install failed' }
          "MONAW_PACKAGED_APP=$(Join-Path $installDir 'Monaw.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MONAW_UPDATE_TEST_INSTALLER=$((Resolve-Path frontend/release/Monaw-Setup-1.1.1-x64.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download, install, restart and verify retained settings
        working-directory: frontend
        run: npx playwright test -c playwright.packaged.config.ts -g 'installs a newer version and preserves settings'
      - name: Upload update-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installed-update-test
          path: frontend/test-results/packaged
          if-no-files-found: warn
      - name: Uninstall the test app
        if: always()
        shell: pwsh
        run: |
          if ($env:MONAW_PACKAGED_APP) {
            $uninstaller = Join-Path (Split-Path -Parent $env:MONAW_PACKAGED_APP) 'Uninstall Monaw.exe'
            if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait -WindowStyle Hidden }
          }
