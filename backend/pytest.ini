[pytest]
testpaths = app/agent/tests
addopts = --strict-markers --durations=20
timeout = 120
timeout_method = thread
markers =
    api: HTTP routes, schemas, and runtime API configuration
    runtime: agent orchestration, providers, jobs, settings, and tool harness
    policy: approvals, access grants, controller policy, and core controls
    sandbox: sandbox policy, runners, paths, sessions, and environments
    skills: executable capability modules such as browser, exec, filesystem, and MCP
    memory: long-term memory, retrieval, consolidation, archive, and migrations
    integrations: scheduler and external integration behavior
