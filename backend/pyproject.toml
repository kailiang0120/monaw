[project]
name = "monaw-backend"
version = "1.0.0"
description = "Local FastAPI backend for Monaw"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiosqlite>=0.20.0",
    "browser-use>=0.12.6,<0.13.0",
    "comtypes>=1.2.0",
    "croniter~=6.0",
    "fastapi>=0.115.0",
    "faster-whisper>=1.1.0",
    "google-genai==1.65.0",
    "imageio-ffmpeg>=0.5.1",
    "langchain==1.2.15",
    "langchain-core==1.2.28",
    "langchain-tavily==0.2.17",
    "langgraph>=1.1.0",
    "mcp>=1.0.0",
    "mss>=9.0.0",
    "openai>=1.89.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pyyaml>=6.0.0",
    "scrapling>=0.4.8,<0.5.0",
    "sse-starlette>=2.1.0",
    "tavily-python>=0.5.0",
    "tiktoken>=0.8.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.1",
]

[tool.uv]
package = false
